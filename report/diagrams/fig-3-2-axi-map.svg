<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" width="960" height="700" font-family="Microsoft YaHei, PingFang SC, sans-serif">
<defs>
  <marker id="a2" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#2C6E9B"/>
  </marker>
  <marker id="r2" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#B5392A"/>
  </marker>
  <style>
    .blk{fill:#eef4f8;stroke:#2C6E9B;stroke-width:1.2;}
    .slv{fill:#f7f3ec;stroke:#8a7f6d;stroke-width:1.1;}
    .hl{fill:#fdf0ee;stroke:#B5392A;stroke-width:1.8;}
    .tb{font-size:13px;font-weight:700;fill:#1a1a1a;}
    .nm{font-size:12.5px;font-weight:700;fill:#1a1a1a;font-family:Consolas,monospace;}
    .ad{font-size:12px;fill:#B5392A;font-family:Consolas,monospace;}
    .s{font-size:11px;fill:#5a5a5a;}
    .blue{font-size:12px;fill:#2C6E9B;font-weight:700;}
    .red{font-size:11.5px;fill:#B5392A;font-weight:700;}
    .busl{stroke:#2C6E9B;stroke-width:2.6;fill:none;}
    .stub{stroke:#2C6E9B;stroke-width:1.4;fill:none;marker-end:url(#a2);}
    .emio{stroke:#B5392A;stroke-width:1.3;fill:none;stroke-dasharray:6 4;marker-end:url(#r2);}
  </style>
</defs>

<!-- PS -->
<rect class="blk" x="28" y="256" width="152" height="176" rx="3" stroke-width="1.6"/>
<text class="tb" x="104" y="284" text-anchor="middle">PS7 ARM Cortex-A9</text>
<text class="s" x="104" y="304" text-anchor="middle">Python 3.10 / Jupyter</text>
<text class="s" x="104" y="322" text-anchor="middle">PYNQ 3.0.1</text>
<line x1="88" y1="334" x2="120" y2="334" stroke="#c9c2b6" stroke-width="1"/>
<text class="s" x="104" y="352" text-anchor="middle">连通域 / 裁 ROI</text>
<text class="s" x="104" y="370" text-anchor="middle">跨帧跟踪计数</text>
<text class="s" x="104" y="388" text-anchor="middle">OSD 内容 / 舵机分派</text>
<text class="s" x="104" y="412" text-anchor="middle">M_AXI_GP0 主端口</text>

<!-- AXI 互联 -->
<rect class="blk" x="212" y="250" width="150" height="190" rx="3"/>
<text class="tb" x="287" y="352" text-anchor="middle" transform="rotate(-90 287 352)">AXI Interconnect</text>

<!-- 总线条干 -->
<line class="busl" x1="362" y1="355" x2="402" y2="355"/>
<line x1="402" y1="63" x2="402" y2="618" stroke="#2C6E9B" stroke-width="2.6"/>
<text class="blue" x="410" y="676">AXI4-Lite · 每设备 64 KB 地址窗 · 地址由 BD 自动分配</text>

<!-- 从设备 -->
<rect class="slv" x="432" y="40" width="496" height="46" rx="2"/>
<text class="nm" x="442" y="69">dd_osd_axis_0</text>
<text class="ad" x="600" y="69">0x40000000</text>
<text class="s" x="712" y="69">显示叠加：框 / 英文名 / 汇总 / 分拣竖线</text>
<line class="stub" x1="402" y1="63" x2="432" y2="63"/>

<rect class="slv" x="432" y="116" width="496" height="46" rx="2"/>
<text class="nm" x="442" y="145">axi_vdma_0</text>
<text class="ad" x="600" y="145">0x43000000</text>
<text class="s" x="712" y="145">S2MM 写 buf0；MM2S 回读背景帧</text>
<line class="stub" x1="402" y1="139" x2="432" y2="139"/>

<rect class="slv" x="432" y="192" width="496" height="46" rx="2"/>
<text class="nm" x="442" y="221">axi_vdma_1</text>
<text class="ad" x="600" y="221">0x43010000</text>
<text class="s" x="712" y="221">S2MM 写 buf1（掩膜）；MM2S 读 buf0</text>
<line class="stub" x1="402" y1="215" x2="432" y2="215"/>

<rect class="slv" x="432" y="268" width="496" height="46" rx="2"/>
<text class="nm" x="442" y="297">v_tc_0</text>
<text class="ad" x="600" y="297">0x43C00000</text>
<text class="s" x="712" y="297">720p 显示时序生成（VTG 主 / 从）</text>
<line class="stub" x1="402" y1="291" x2="432" y2="291"/>

<rect class="slv" x="432" y="344" width="496" height="46" rx="2"/>
<text class="nm" x="442" y="373">axi_dynclk_0</text>
<text class="ad" x="600" y="373">0x43C10000</text>
<text class="s" x="712" y="373">像素时钟 74.29 MHz（DRP 动态配置）</text>
<line class="stub" x1="402" y1="367" x2="432" y2="367"/>

<rect class="slv" x="432" y="420" width="496" height="46" rx="2"/>
<text class="nm" x="442" y="449">glass_defect_core_0</text>
<text class="ad" x="600" y="449">0x43C20000</text>
<text class="s" x="712" y="449">定位流水线：阈值 / 抗阴影 / DISP 档位</text>
<line class="stub" x1="402" y1="443" x2="432" y2="443"/>

<rect class="hl" x="432" y="496" width="496" height="46" rx="2"/>
<text class="nm" x="442" y="525">cnn_top_0</text>
<text class="ad" x="600" y="525">0x43C30000</text>
<text class="s" x="712" y="525">加载权重 / 送 ROI / 取 logits</text>
<line class="stub" x1="402" y1="519" x2="432" y2="519"/>

<rect class="slv" x="432" y="572" width="496" height="46" rx="2"/>
<text class="nm" x="442" y="601">servo_pwm_0</text>
<text class="ad" x="600" y="601">0x43C40000</text>
<text class="s" x="712" y="601">三路 SG90 PWM 与拍飞时序（含待发队列）</text>
<line class="stub" x1="402" y1="595" x2="432" y2="595"/>

<!-- CNN 说明 -->
<text class="red" x="442" y="486">★ 不走视频流：PS 送 64×64 ROI、读 6 维 logits，与定位流水线并行工作</text>

<!-- SCCB -->
<rect class="blk" x="28" y="470" width="152" height="72" rx="3"/>
<text class="tb" x="104" y="496" text-anchor="middle">EMIO GPIO</text>
<text class="s" x="104" y="514" text-anchor="middle">0xE000A000 bank2</text>
<text class="s" x="104" y="532" text-anchor="middle">SCL / SDA 位敲</text>
<path class="emio" d="M180,506 L198,506"/>
<text class="red" x="204" y="452">EMIO：SCL / SDA 位敲 → OV5640 寄存器（SCCB）</text>
</svg>
