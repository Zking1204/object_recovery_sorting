<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1130 280" width="1130" height="280" font-family="Microsoft YaHei, PingFang SC, sans-serif">
<defs>
  <marker id="a5" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
  </marker>
  <marker id="r5" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#B5392A"/>
  </marker>
  <style>
    .st{fill:#f7f3ec;stroke:#8a7f6d;stroke-width:1.2;}
    .gate{fill:#fdf0ee;stroke:#B5392A;stroke-width:1.8;}
    .tb{font-size:11.5px;font-weight:700;fill:#1a1a1a;}
    .s{font-size:10px;fill:#5a5a5a;}
    .red{font-size:10.5px;fill:#B5392A;font-weight:700;}
    .ln{stroke:#333333;stroke-width:1.3;fill:none;marker-end:url(#a5);}
    .ret{stroke:#B5392A;stroke-width:1.3;fill:none;stroke-dasharray:6 4;marker-end:url(#r5);}
  </style>
</defs>

<rect class="st" x="14" y="56" width="108" height="76" rx="3"/>
<text class="tb" x="68" y="86" text-anchor="middle">① 需求与</text>
<text class="tb" x="68" y="102" text-anchor="middle">指标定义</text>
<text class="s" x="68" y="120" text-anchor="middle">6 类 · ≥90%</text>

<rect class="st" x="138" y="56" width="108" height="76" rx="3"/>
<text class="tb" x="192" y="86" text-anchor="middle">② 软硬件</text>
<text class="tb" x="192" y="102" text-anchor="middle">划分</text>
<text class="s" x="192" y="120" text-anchor="middle">PL 逐像素 / PS 整帧</text>

<rect class="st" x="262" y="56" width="108" height="76" rx="3"/>
<text class="tb" x="316" y="86" text-anchor="middle">③ 算法建模</text>
<text class="tb" x="316" y="102" text-anchor="middle">黄金参考</text>
<text class="s" x="316" y="120" text-anchor="middle">PC 逐位复刻</text>

<rect class="st" x="386" y="56" width="108" height="76" rx="3"/>
<text class="tb" x="440" y="86" text-anchor="middle">④ RTL /</text>
<text class="tb" x="440" y="102" text-anchor="middle">HLS 实现</text>
<text class="s" x="440" y="120" text-anchor="middle">逐行注释</text>

<rect class="gate" x="510" y="56" width="108" height="76" rx="3"/>
<text class="tb" x="564" y="86" text-anchor="middle">⑤ 仿真验证</text>
<text class="s" x="564" y="104" text-anchor="middle">testbench</text>
<text class="red" x="564" y="122" text-anchor="middle">全绿才放行</text>

<rect class="st" x="634" y="56" width="108" height="76" rx="3"/>
<text class="tb" x="688" y="86" text-anchor="middle">⑥ 综合与</text>
<text class="tb" x="688" y="102" text-anchor="middle">实现</text>
<text class="s" x="688" y="120" text-anchor="middle">WNS ≥ 0.2 ns</text>

<rect class="st" x="758" y="56" width="108" height="76" rx="3"/>
<text class="tb" x="812" y="86" text-anchor="middle">⑦ 上板</text>
<text class="tb" x="812" y="102" text-anchor="middle">联调</text>
<text class="s" x="812" y="120" text-anchor="middle">视频通路 / 显示</text>

<rect class="st" x="882" y="56" width="108" height="76" rx="3"/>
<text class="tb" x="936" y="86" text-anchor="middle">⑧ 参数标定</text>
<text class="tb" x="936" y="102" text-anchor="middle">与实测</text>
<text class="s" x="936" y="120" text-anchor="middle">阈值 / 分拣时序</text>

<rect class="st" x="1006" y="56" width="108" height="76" rx="3"/>
<text class="tb" x="1060" y="86" text-anchor="middle">⑨ 归档与</text>
<text class="tb" x="1060" y="102" text-anchor="middle">技能沉淀</text>
<text class="s" x="1060" y="120" text-anchor="middle">skill/ 提炼</text>

<line class="ln" x1="122" y1="94" x2="138" y2="94"/>
<line class="ln" x1="246" y1="94" x2="262" y2="94"/>
<line class="ln" x1="370" y1="94" x2="386" y2="94"/>
<line class="ln" x1="494" y1="94" x2="510" y2="94"/>
<line class="ln" x1="618" y1="94" x2="634" y2="94"/>
<line class="ln" x1="742" y1="94" x2="758" y2="94"/>
<line class="ln" x1="866" y1="94" x2="882" y2="94"/>
<line class="ln" x1="990" y1="94" x2="1006" y2="94"/>

<!-- 反馈回流 -->
<polyline class="ret" points="812,132 812,196 440,196 440,136"/>
<text class="red" x="626" y="188" text-anchor="middle">联调发现问题 → 改 RTL → 重新仿真 → 重新综合（不跳过任一步）</text>

<text class="s" x="14" y="248">每一步都留可复现的判据与实测数据；判据写进报告，而不是只写结果</text>
<text class="s" x="14" y="268">仿真门禁只在 testbench 全绿时放行综合；仿真失败一律回到 ④，不得在 ⑥ 打补丁</text>
</svg>
