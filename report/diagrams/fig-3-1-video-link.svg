<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 810" width="1240" height="810" font-family="Microsoft YaHei, PingFang SC, sans-serif">
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
  </marker>
  <marker id="ad" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#B5392A"/>
  </marker>
  <marker id="ab" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#2C6E9B"/>
  </marker>
  <style>
    .blk{fill:#f7f3ec;stroke:#8a7f6d;stroke-width:1.2;}
    .blk2{fill:#eef4f8;stroke:#2C6E9B;stroke-width:1.2;}
    .mem{fill:#ffffff;stroke:#8a7f6d;stroke-width:1;}
    .tb{font-size:13.5px;font-weight:700;fill:#1a1a1a;}
    .s{font-size:11px;fill:#5a5a5a;}
    .ss{font-size:10.5px;fill:#5a5a5a;}
    .red{font-size:11.5px;fill:#B5392A;font-weight:700;}
    .blue{font-size:11.5px;fill:#2C6E9B;font-weight:700;}
    .ln{stroke:#333333;stroke-width:1.3;fill:none;marker-end:url(#a);}
    .dsh{stroke:#B5392A;stroke-width:1.3;fill:none;stroke-dasharray:6 4;marker-end:url(#ad);}
    .ctl{stroke:#2C6E9B;stroke-width:1.4;fill:none;marker-end:url(#ab);}
    .band{fill:none;stroke:#B5392A;stroke-width:1;stroke-dasharray:7 5;}
    .band2{fill:none;stroke:#2C6E9B;stroke-width:1;stroke-dasharray:7 5;}
  </style>
</defs>

<!-- 域 ① 采集 -->
<rect class="band" x="14" y="40" width="176" height="112" rx="4"/>
<text class="red" x="22" y="146">采集域　≈72 MHz</text>
<rect class="blk" x="26" y="64" width="152" height="64" rx="3"/>
<text class="tb" x="102" y="88" text-anchor="middle">OV5640 模组</text>
<text class="s" x="102" y="108" text-anchor="middle">DVP 8bit × 2</text>

<!-- 域 ② 算法域 -->
<rect class="band" x="200" y="40" width="830" height="330" rx="4"/>
<text class="red" x="208" y="58">算法域　FCLK_CLK0 = 100 MHz</text>

<rect class="blk" x="214" y="64" width="150" height="64" rx="3"/>
<text class="tb" x="289" y="88" text-anchor="middle">采集 IP</text>
<text class="s" x="289" y="108" text-anchor="middle">ov5640_capture_data_0</text>

<rect class="blk" x="396" y="64" width="160" height="64" rx="3"/>
<text class="tb" x="476" y="94" text-anchor="middle">v_vid_in_axi4s_0</text>

<rect class="blk" x="588" y="64" width="140" height="64" rx="3"/>
<text class="tb" x="658" y="88" text-anchor="middle">axis_broadcaster</text>
<text class="s" x="658" y="108" text-anchor="middle">1 → 2（无缓冲）</text>

<rect class="blk" x="800" y="68" width="176" height="52" rx="3"/>
<text class="tb" x="888" y="98" text-anchor="middle">axi_vdma_0 / S2MM</text>

<rect class="blk" x="430" y="186" width="230" height="86" rx="3" stroke="#B5392A" stroke-width="1.8"/>
<text class="tb" x="545" y="212" text-anchor="middle">PL 定位核</text>
<text class="s" x="545" y="232" text-anchor="middle">glass_defect_core_v2</text>
<text class="s" x="545" y="250" text-anchor="middle">14 拍流水线 + 抗阴影</text>

<rect class="blk" x="800" y="190" width="176" height="56" rx="3"/>
<text class="tb" x="888" y="212" text-anchor="middle">axi_vdma_1 / S2MM</text>
<text class="s" x="888" y="230" text-anchor="middle">写掩膜 → buf1</text>

<rect class="blk" x="214" y="300" width="210" height="66" rx="3" stroke="#B5392A" stroke-width="1.8"/>
<text class="tb" x="319" y="324" text-anchor="middle">cnn_top（HLS）</text>
<text class="s" x="319" y="342" text-anchor="middle">int8 CNN 加速器</text>
<text class="s" x="319" y="357" text-anchor="middle">128 MAC/周期</text>

<rect class="blk" x="470" y="300" width="190" height="66" rx="3" stroke="#B5392A" stroke-width="1.8"/>
<text class="tb" x="565" y="324" text-anchor="middle">servo_pwm</text>
<text class="s" x="565" y="342" text-anchor="middle">三路 PWM + 状态机</text>
<text class="s" x="565" y="357" text-anchor="middle">周期边界锁存</text>

<rect x="720" y="300" width="180" height="66" rx="3" fill="#eef4f8" stroke="#2C6E9B" stroke-width="1.2"/>
<text class="tb" x="810" y="324" text-anchor="middle">三只 SG90 舵机</text>
<text class="s" x="810" y="342" text-anchor="middle">外部 5 V 独立供电</text>
<text class="s" x="810" y="357" text-anchor="middle">20 ms / 1~2 ms</text>

<!-- 视频主链 -->
<line class="ln" x1="178" y1="96" x2="214" y2="96"/>
<line class="ln" x1="364" y1="96" x2="396" y2="96"/>
<line class="ln" x1="556" y1="96" x2="588" y2="96"/>
<text class="s" x="476" y="146" text-anchor="middle">AXI4-Stream</text>
<text class="red" x="476" y="164" text-anchor="middle">跨时钟域 ①</text>

<polyline class="ln" points="630,128 630,186"/>
<text class="s" x="638" y="160">M00</text>
<line class="ln" x1="728" y1="94" x2="800" y2="94"/>
<text class="ss" x="736" y="84">M01</text>

<line class="ln" x1="660" y1="220" x2="800" y2="220"/>
<text class="s" x="730" y="212" text-anchor="middle">掩膜</text>

<line class="ln" x1="976" y1="94" x2="1040" y2="94"/>
<line class="ln" x1="976" y1="218" x2="1040" y2="218"/>

<!-- 背景回读 -->
<polyline class="dsh" points="1040,292 545,292 545,272"/>
<text class="red" x="730" y="286" text-anchor="middle">MM2S 回读背景</text>

<!-- CNN 双向数据 -->
<polyline class="dsh" points="319,366 319,392 1040,392"/>
<text class="red" x="700" y="410" text-anchor="middle">m_axi：读 buf_in / 写 buf_out</text>

<!-- 舵机 -->
<line class="ln" x1="660" y1="333" x2="720" y2="333"/>
<text class="s" x="690" y="325" text-anchor="middle">PWM×3</text>

<!-- DDR -->
<rect x="1040" y="40" width="180" height="480" rx="4" fill="#f2efe9" stroke="#6b6152" stroke-width="1.4"/>
<text class="tb" x="1130" y="58" text-anchor="middle">DDR</text>
<rect class="mem" x="1052" y="66" width="156" height="56" rx="2"/>
<text class="tb" x="1130" y="88" text-anchor="middle">buf0</text>
<text class="s" x="1130" y="106" text-anchor="middle">干净彩色</text>
<rect class="mem" x="1052" y="186" width="156" height="56" rx="2"/>
<text class="tb" x="1130" y="208" text-anchor="middle">buf1</text>
<text class="s" x="1130" y="226" text-anchor="middle">掩膜</text>
<rect class="mem" x="1052" y="258" width="156" height="52" rx="2"/>
<text class="tb" x="1130" y="280" text-anchor="middle">buf_bg</text>
<text class="s" x="1130" y="298" text-anchor="middle">背景帧</text>
<rect class="mem" x="1052" y="330" width="156" height="52" rx="2"/>
<text class="tb" x="1130" y="352" text-anchor="middle">buf_in</text>
<text class="s" x="1130" y="370" text-anchor="middle">64×64 输入</text>
<rect class="mem" x="1052" y="396" width="156" height="52" rx="2"/>
<text class="tb" x="1130" y="418" text-anchor="middle">buf_out</text>
<text class="s" x="1130" y="436" text-anchor="middle">6 个 logits</text>

<!-- 域 ③ 显示 -->
<rect class="band2" x="200" y="420" width="830" height="130" rx="4"/>
<text class="blue" x="208" y="438">显示域　PXL_CLK = 74.29 MHz（由右向左）</text>

<rect class="blk" x="800" y="436" width="176" height="56" rx="3"/>
<text class="tb" x="888" y="458" text-anchor="middle">axi_vdma_1 / MM2S</text>
<text class="s" x="888" y="476" text-anchor="middle">读 buf0</text>

<rect class="blk" x="556" y="436" width="190" height="56" rx="3" stroke="#B5392A" stroke-width="1.8"/>
<text class="tb" x="651" y="458" text-anchor="middle">dd_osd_axis_0</text>
<text class="s" x="651" y="476" text-anchor="middle">零闪叠加</text>

<rect class="blk" x="356" y="436" width="160" height="56" rx="3"/>
<text class="tb" x="436" y="458" text-anchor="middle">v_axi4s_vid_out_0</text>
<text class="s" x="436" y="476" text-anchor="middle">AXIS → 时序</text>

<rect class="blk" x="214" y="436" width="122" height="56" rx="3"/>
<text class="tb" x="275" y="458" text-anchor="middle">DVI 发送器</text>
<text class="s" x="275" y="476" text-anchor="middle">TMDS</text>

<rect x="30" y="438" width="160" height="52" rx="3" fill="#eef4f8" stroke="#2C6E9B" stroke-width="1.2"/>
<text class="tb" x="110" y="460" text-anchor="middle">HDMI 显示器</text>
<text class="s" x="110" y="478" text-anchor="middle">720p60</text>

<line class="ln" x1="1040" y1="464" x2="976" y2="464"/>
<line class="ln" x1="800" y1="464" x2="746" y2="464"/>
<line class="ln" x1="556" y1="464" x2="516" y2="464"/>
<line class="ln" x1="356" y1="464" x2="336" y2="464"/>
<line class="ln" x1="214" y1="464" x2="190" y2="464"/>
<text class="red" x="436" y="510" text-anchor="middle">跨时钟域 ②</text>

<!-- 时钟与显示时序 -->
<rect class="blk2" x="214" y="580" width="320" height="42" rx="3"/>
<text class="ss" x="374" y="606" text-anchor="middle">axi_dynclk_0　74.29 MHz　＋　v_tc_0　720p 时序</text>
<line class="ctl" x1="374" y1="580" x2="374" y2="556"/>

<!-- PS 与配置总线 -->
<line x1="106" y1="660" x2="1220" y2="660" stroke="#2C6E9B" stroke-width="2.4"/>
<text class="blue" x="720" y="652" text-anchor="middle">AXI4-Lite 配置总线（8 个从设备，基地址见 图 3-2）</text>
<line class="ctl" x1="1000" y1="660" x2="1000" y2="376"/>
<line class="ctl" x1="700" y1="660" x2="700" y2="556"/>

<rect class="blk2" x="30" y="690" width="152" height="96" rx="3" stroke-width="1.6"/>
<text class="tb" x="106" y="714" text-anchor="middle">PS7 ARM Cortex-A9</text>
<text class="s" x="106" y="734" text-anchor="middle">Python / Jupyter</text>
<text class="ss" x="106" y="752" text-anchor="middle">SCCB 位敲 · 连通域</text>
<text class="ss" x="106" y="768" text-anchor="middle">跟踪投票 · 参数下发</text>
<line class="ctl" x1="106" y1="690" x2="106" y2="660" marker-end="none"/>

<!-- 图例 -->
<line class="ln" x1="262" y1="770" x2="318" y2="770"/>
<text class="ss" x="326" y="774">视频数据流</text>
<line class="dsh" x1="440" y1="770" x2="496" y2="770"/>
<text class="ss" x="504" y="774">背景回读 / CNN 数据</text>
<line class="ctl" x1="700" y1="770" x2="756" y2="770"/>
<text class="ss" x="764" y="774">AXI-Lite 控制</text>
</svg>
