<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 470" width="1180" height="470" font-family="Microsoft YaHei, PingFang SC, sans-serif">
<defs>
  <marker id="a3" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
  </marker>
  <marker id="r3" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#B5392A"/>
  </marker>
  <style>
    .stg{fill:#f7f3ec;stroke:#8a7f6d;stroke-width:1.2;}
    .io{fill:#eef4f8;stroke:#2C6E9B;stroke-width:1.2;}
    .nm{font-size:12.5px;font-weight:700;fill:#1a1a1a;font-family:Consolas,monospace;}
    .fn{font-size:10px;fill:#4a4a4a;}
    .lt{font-size:11px;font-weight:700;fill:#B5392A;}
    .s{font-size:11px;fill:#5a5a5a;}
    .tb{font-size:12px;font-weight:700;fill:#1a1a1a;}
    .ln{stroke:#333333;stroke-width:1.3;fill:none;marker-end:url(#a3);}
    .bg{stroke:#B5392A;stroke-width:1.3;fill:none;stroke-dasharray:6 4;marker-end:url(#r3);}
  </style>
</defs>

<!-- 输入：相机彩色流 -->
<rect class="io" x="10" y="164" width="152" height="62" rx="3"/>
<text class="tb" x="86" y="188" text-anchor="middle">s_axis</text>
<text class="s" x="86" y="206" text-anchor="middle">相机彩色 24 bit</text>
<text class="s" x="86" y="220" text-anchor="middle">AXI4-Stream</text>
<line class="ln" x1="162" y1="195" x2="185" y2="195"/>

<!-- 输入：背景彩色流（DDR 回读，下方进入 dd_pair） -->
<rect class="io" x="284" y="300" width="200" height="58" rx="3"/>
<text class="tb" x="384" y="322" text-anchor="middle">s_axis_bg</text>
<text class="s" x="384" y="340" text-anchor="middle">背景彩色 24 bit（DDR 回读）</text>
<path class="bg" d="M384,300 L384,250"/>

<!-- 七个流水级 -->
<rect class="stg" x="185" y="140" width="118" height="110" rx="3"/>
<text class="nm" x="244" y="166" text-anchor="middle">dd_gray</text>
<text class="fn" x="244" y="188" text-anchor="middle">24 位逐位透传</text>
<text class="fn" x="244" y="204" text-anchor="middle">内部不做运算</text>
<text class="lt" x="244" y="234" text-anchor="middle">+1 拍</text>

<rect class="stg" x="325" y="140" width="118" height="110" rx="3" stroke="#B5392A" stroke-width="1.8"/>
<text class="nm" x="384" y="166" text-anchor="middle">dd_pair</text>
<text class="fn" x="384" y="188" text-anchor="middle">双流对齐</text>
<text class="fn" x="384" y="204" text-anchor="middle">tight 反压 1:1</text>
<text class="fn" x="384" y="218" text-anchor="middle">帧首锚定</text>
<text class="lt" x="384" y="240" text-anchor="middle">+1 拍</text>

<rect class="stg" x="465" y="140" width="118" height="110" rx="3" stroke="#B5392A" stroke-width="1.8"/>
<text class="nm" x="524" y="166" text-anchor="middle">dd_shadow</text>
<text class="fn" x="524" y="188" text-anchor="middle">灰度 / 色度现算</text>
<text class="fn" x="524" y="204" text-anchor="middle">抗阴影三判据</text>
<text class="fn" x="524" y="218" text-anchor="middle">加权打分</text>
<text class="lt" x="524" y="240" text-anchor="middle">+5 拍</text>

<rect class="stg" x="605" y="140" width="118" height="110" rx="3"/>
<text class="nm" x="664" y="166" text-anchor="middle">dd_win3x3</text>
<text class="fn" x="664" y="188" text-anchor="middle">3×3 邻域展开</text>
<text class="fn" x="664" y="204" text-anchor="middle">行缓冲 1 个</text>
<text class="fn" x="664" y="218" text-anchor="middle">BRAM18</text>
<text class="lt" x="664" y="240" text-anchor="middle">+2 拍</text>

<rect class="stg" x="745" y="140" width="118" height="110" rx="3"/>
<text class="nm" x="804" y="166" text-anchor="middle">dd_median3</text>
<text class="fn" x="804" y="188" text-anchor="middle">3×3 中值</text>
<text class="fn" x="804" y="204" text-anchor="middle">纯比较器网络</text>
<text class="fn" x="804" y="218" text-anchor="middle">0 DSP</text>
<text class="lt" x="804" y="240" text-anchor="middle">+3 拍</text>

<rect class="stg" x="885" y="140" width="118" height="110" rx="3"/>
<text class="nm" x="944" y="166" text-anchor="middle">dd_thresh</text>
<text class="fn" x="944" y="188" text-anchor="middle">阈值比较</text>
<text class="fn" x="944" y="204" text-anchor="middle">含极性选择</text>
<text class="fn" x="944" y="218" text-anchor="middle">输出 1 bit</text>
<text class="lt" x="944" y="240" text-anchor="middle">+0 拍</text>

<rect class="stg" x="1025" y="140" width="118" height="110" rx="3"/>
<text class="nm" x="1084" y="166" text-anchor="middle">dd_morph</text>
<text class="fn" x="1084" y="188" text-anchor="middle">3×3 闭运算</text>
<text class="fn" x="1084" y="204" text-anchor="middle">膨胀 → 腐蚀</text>
<text class="fn" x="1084" y="218" text-anchor="middle">去孤立点</text>
<text class="lt" x="1084" y="240" text-anchor="middle">+2 拍</text>

<!-- 级间连线 -->
<line class="ln" x1="303" y1="195" x2="325" y2="195"/>
<line class="ln" x1="443" y1="195" x2="465" y2="195"/>
<line class="ln" x1="583" y1="195" x2="605" y2="195"/>
<line class="ln" x1="723" y1="195" x2="745" y2="195"/>
<line class="ln" x1="863" y1="195" x2="885" y2="195"/>
<line class="ln" x1="1003" y1="195" x2="1025" y2="195"/>

<!-- 输出 -->
<path class="ln" d="M1084,250 L1084,272"/>
<text class="s" x="1084" y="292" text-anchor="middle">掩膜 1 bit</text>
<text class="s" x="1084" y="308" text-anchor="middle">→ VDMA1/S2MM</text>
<text class="s" x="1084" y="324" text-anchor="middle">→ buf1</text>

<!-- 总延迟 -->
<line x1="185" y1="112" x2="1143" y2="112" stroke="#B5392A" stroke-width="1.4"/>
<line x1="185" y1="112" x2="185" y2="128" stroke="#B5392A" stroke-width="1.4"/>
<line x1="1143" y1="112" x2="1143" y2="128" stroke="#B5392A" stroke-width="1.4"/>
<text class="lt" x="664" y="102" text-anchor="middle">整链 14 拍　@100 MHz = 140 ns（相对一帧 ≈35 ms 可忽略）</text>

<!-- 关键说明 -->
<text class="s" x="185" y="404">灰化/色度在配对之后才做（配对前灰度化会销毁色度信息）</text>
<text class="s" x="185" y="424">每个新特性自带旁路位，关闭时逐像素等价上一版；复位值 = 旧行为</text>
</svg>
